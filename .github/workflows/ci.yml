name: CI

# デプロイは Vercel が行う。ここでは確認だけを担当する。
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# 同じブランチに新しい push が来たら、古い実行は打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # package-lock.json のとおりに入れる（npm install と違い lock を書き換えない）
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
