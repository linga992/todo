<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 class="title">TODO</h1>
      <p class="summary" id="summary"></p>
    </header>

    <form class="new-form" id="new-form" autocomplete="off">
      <input
        class="new-input"
        id="new-input"
        type="text"
        placeholder="やることを入力して Enter"
        maxlength="200"
        aria-label="新しいタスク"
        required>
      <button class="btn btn-primary" type="submit">追加</button>
    </form>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="表示の絞り込み">
        <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">すべて</button>
        <button class="filter" type="button" data-filter="active" aria-pressed="false">未完了</button>
        <button class="filter" type="button" data-filter="done" aria-pressed="false">完了</button>
      </div>
      <button class="btn btn-ghost" type="button" id="clear-done">完了を削除</button>
    </div>

    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden></p>

    <footer class="app-footer">
      <p>ダブルクリックで編集 ・ ドラッグで並べ替え（「すべて」表示のとき）</p>
      <p>データはこのブラウザ内（localStorage）に保存されます。</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
